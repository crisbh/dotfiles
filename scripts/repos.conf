# Folders `repos` searches for git repositories, shared by every machine.
# One per line: the folder, then how many levels below it to look
# (0: the folder is itself a repository). Missing folders are skipped.
# `ignore-branch PATTERN` lines name local-only branches that do not count as
# unpushed (shell patterns, matched against the branch name).
ignore-branch backup/*

~/.dotfiles 0
~/.dotfiles-worktrees 1
~/Projects 3
~/Cursos 2
